services:
  docs:
    build:
      context: .
    image: authifi-docs:local
    ports:
      - "${DOCS_PORT:-8000}:8080"
    environment:
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost:${DOCS_PORT:-8000}}"
      SITE_DIR: /app/site
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health').read()"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
