services:
  docs:
    build:
      context: .
    image: authifi-docs:local
    ports:
      - "${DOCS_PORT:-8000}:8080"
    environment:
      OIDC_ISSUER: "${OIDC_ISSUER:?Set OIDC_ISSUER in .env or the environment.}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:?Set OIDC_CLIENT_ID in .env or the environment.}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:?Set OIDC_CLIENT_SECRET in .env or the environment.}"
      SESSION_SECRET: "${SESSION_SECRET:?Set SESSION_SECRET in .env or the environment.}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost:8000}"
      SITE_DIR: /app/site
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health').read()"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
