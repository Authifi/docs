name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_sha:
        description: Existing release SHA to deploy without rebuilding
        required: false
        type: string

concurrency:
  group: authifi-docs-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
  RELEASE_BUCKET_NAME: ${{ vars.RELEASE_BUCKET_NAME }}
  DOCS_INSTANCE_ID: ${{ vars.DOCS_INSTANCE_ID }}
  DOCS_SSM_DOCUMENT_NAME: ${{ vars.DOCS_SSM_DOCUMENT_NAME }}
  DOCS_TARGET_GROUP_ARN: ${{ vars.DOCS_TARGET_GROUP_ARN }}
  DOCS_PUBLIC_BASE_URL: ${{ vars.DOCS_PUBLIC_BASE_URL }}

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt

      - name: Verify required repository variables
        shell: bash
        run: |
          set -euo pipefail
          : "${AWS_REGION:?Set repository variable AWS_REGION}"
          : "${AWS_DEPLOY_ROLE_ARN:?Set repository variable AWS_DEPLOY_ROLE_ARN}"
          : "${RELEASE_BUCKET_NAME:?Set repository variable RELEASE_BUCKET_NAME}"
          : "${DOCS_INSTANCE_ID:?Set repository variable DOCS_INSTANCE_ID}"
          : "${DOCS_SSM_DOCUMENT_NAME:?Set repository variable DOCS_SSM_DOCUMENT_NAME}"
          : "${DOCS_TARGET_GROUP_ARN:?Set repository variable DOCS_TARGET_GROUP_ARN}"
          : "${DOCS_PUBLIC_BASE_URL:?Set repository variable DOCS_PUBLIC_BASE_URL}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Select release
        id: release
        shell: bash
        env:
          REQUESTED_RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_sha || '' }}
        run: |
          set -euo pipefail

          requested_sha="${REQUESTED_RELEASE_SHA}"
          if [[ -n "$requested_sha" ]]; then
            sha="$requested_sha"
            build=false
          else
            sha="$GITHUB_SHA"
            build=true
          fi

          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release SHA must be 40 lowercase hexadecimal characters" >&2
            exit 1
          fi

          {
            echo "sha=$sha"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"

      - name: Build release
        if: ${{ steps.release.outputs.build == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build-release.sh "${{ steps.release.outputs.sha }}" dist/releases

      - name: Publish or verify release
        if: ${{ steps.release.outputs.build == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          sha="${{ steps.release.outputs.sha }}"
          prefix="s3://$RELEASE_BUCKET_NAME/releases"
          remote_checksum="dist/releases/remote.sha256"

          if aws s3api head-object \
            --bucket "$RELEASE_BUCKET_NAME" \
            --key "releases/$sha.tar.gz" > /dev/null 2>&1; then
            aws s3api head-object \
              --bucket "$RELEASE_BUCKET_NAME" \
              --key "releases/$sha.tar.gz.sha256" > /dev/null
            aws s3 cp "$prefix/$sha.tar.gz.sha256" "$remote_checksum"
            (
              cd dist/releases
              sha256sum --check "$(basename "$remote_checksum")"
            ) || {
              echo "checksum mismatch for existing release" >&2
              exit 1
            }
          else
            aws s3 cp "dist/releases/$sha.tar.gz" "$prefix/$sha.tar.gz"
            aws s3 cp "dist/releases/$sha.tar.gz.sha256" "$prefix/$sha.tar.gz.sha256"
          fi

      - name: Install release through SSM
        id: command
        shell: bash
        run: |
          set -euo pipefail

          sha="${{ steps.release.outputs.sha }}"
          command_id="$(aws ssm send-command \
            --document-name "$DOCS_SSM_DOCUMENT_NAME" \
            --instance-ids "$DOCS_INSTANCE_ID" \
            --parameters "ReleaseSha=${sha}" \
            --query 'Command.CommandId' \
            --output text)"
          echo "id=$command_id" >> "$GITHUB_OUTPUT"

      - name: Wait for installer
        shell: bash
        run: |
          set -euo pipefail

          command_id="${{ steps.command.outputs.id }}"
          dump_invocation() {
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$DOCS_INSTANCE_ID" \
              --query "$1" \
              --output text || true
          }

          if ! aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "$DOCS_INSTANCE_ID"; then
            echo "SSM command $command_id did not finish successfully." >&2
            echo "Status: $(dump_invocation Status)" >&2
            echo "Response code: $(dump_invocation ResponseCode)" >&2
            echo "Installer stdout:" >&2
            dump_invocation StandardOutputContent >&2
            echo "Installer stderr:" >&2
            dump_invocation StandardErrorContent >&2
            exit 1
          fi

          status="$(dump_invocation Status)"
          if [[ "$status" != "Success" ]]; then
            echo "SSM command $command_id ended with status $status." >&2
            echo "Response code: $(dump_invocation ResponseCode)" >&2
            echo "Installer stdout:" >&2
            dump_invocation StandardOutputContent >&2
            echo "Installer stderr:" >&2
            dump_invocation StandardErrorContent >&2
            exit 1
          fi

      - name: Wait for healthy ALB target
        shell: bash
        run: |
          set -euo pipefail

          if ! aws elbv2 wait target-in-service --target-group-arn "$DOCS_TARGET_GROUP_ARN"; then
            aws elbv2 describe-target-health --target-group-arn "$DOCS_TARGET_GROUP_ARN"
            exit 1
          fi

      - name: Verify public and protected routes
        shell: bash
        run: |
          set -euo pipefail

          base_url="${DOCS_PUBLIC_BASE_URL%/}"
          if [[ "$base_url" != https://* ]]; then
            base_url="https://${base_url#http://}"
          fi
          public_url="${base_url}/privacy-policy/"
          protected_url="${base_url}/guides/sso-integration-guide/"
          deadline=$((SECONDS + 300))
          attempt=0

          while true; do
            attempt=$((attempt + 1))
            public_headers="$(mktemp)"
            protected_headers="$(mktemp)"

            public_result="$(curl --silent --show-error --max-time 30 --max-redirs 0 \
              --output /dev/null --dump-header "$public_headers" \
              --write-out '%{http_code} %{url_effective}' "$public_url" || true)"
            public_status="${public_result%% *}"
            public_status="${public_status:-000}"
            public_final_url="${public_result#* }"
            public_content_type="$(grep -i '^content-type:' "$public_headers" | tail -n 1 | cut -d: -f2- | tr -d '\r' | xargs || true)"

            protected_status="$(curl --silent --show-error --max-time 30 --max-redirs 0 \
              --output /dev/null --dump-header "$protected_headers" \
              --write-out '%{http_code}' "$protected_url" || true)"
            protected_status="${protected_status:-000}"
            protected_location="$(grep -i '^location:' "$protected_headers" | tail -n 1 | cut -d: -f2- | tr -d '\r' | xargs || true)"

            if [[ "$public_status" == "200" \
              && "$public_content_type" == text/html* \
              && "$public_final_url" == "$public_url" \
              && "$protected_status" == "307" \
              && "$protected_location" == /_auth/login* ]]; then
              echo "Post-deploy checks passed on attempt $attempt."
              break
            fi

            if (( SECONDS >= deadline )); then
              echo "Post-deploy checks failed." >&2
              echo "Public URL: $public_url" >&2
              echo "Expected 200 text/html with no redirect; got status $public_status, content type '${public_content_type}', final URL '${public_final_url}'." >&2
              cat "$public_headers" >&2
              echo "Protected URL: $protected_url" >&2
              echo "Expected 307 redirect to /_auth/login; got status $protected_status, location '${protected_location}'." >&2
              cat "$protected_headers" >&2
              exit 1
            fi

            echo "Attempt $attempt failed; retrying..."
            sleep 10
          done
